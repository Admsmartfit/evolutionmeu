<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conectar WhatsApp</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="card">
    <h1>Conectar WhatsApp</h1>
    <p class="subtitle" id="instance-label"></p>

    <form id="setup-form" class="hidden">
      <label>Nome da instância <input id="setup-instance" required /></label>
      <label>Token da instância <input id="setup-token" type="password" required /></label>
      <button type="submit" class="btn">Continuar</button>
      <p class="hint">Peça esses dados a quem administra o sistema.</p>
    </form>

    <div id="status-area" class="hidden">
      <div id="state-connected" class="hidden">
        <div class="icon-ok">&#10003;</div>
        <p class="state-text">WhatsApp conectado com sucesso.</p>
      </div>

      <div id="state-waiting" class="hidden">
        <p class="state-text">Abra o WhatsApp no celular, vá em <strong>Aparelhos conectados</strong> → <strong>Conectar aparelho</strong> e escaneie o código abaixo.</p>
        <img id="qr-image" alt="QR Code" />
        <p class="hint" id="qr-refresh-hint"></p>
      </div>

      <div id="state-loading" class="hidden">
        <p class="state-text">Carregando…</p>
      </div>

      <div id="state-error" class="hidden">
        <p class="state-text error-text" id="error-text"></p>
        <button type="button" class="btn" id="retry-btn">Tentar novamente</button>
      </div>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
