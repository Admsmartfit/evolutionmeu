version: '3.8'

services:
  evolution-api:
    build: .
    container_name: evolution_api
    restart: always
    ports:
      - "8085:8085"
    env_file:
      - .env
    environment:
      - SERVER_PORT=8085
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres@evolution_postgres:5432/evolution_db?schema=public
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution_redis:6379/0
    depends_on:
      - evolution_postgres
      - evolution_redis
      - evolution_minio
    volumes:
      - evolution_instances:/evolution/instances

  evolution_minio:
    image: minio/minio:latest
    container_name: evolution_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      # 9000 = S3 API (must be reachable by the browser for media playback in the
      # Manager — proxy this behind HTTPS, e.g. https://s3.ricardo.home.nom.br, the
      # same way evolution-api itself is proxied). 9001 = web console (admin only,
      # fine to keep on the LAN / behind the firewall).
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  evolution_whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: evolution_whisper
    restart: always
    environment:
      WHISPER__MODEL: Systran/faster-whisper-small
    volumes:
      - whisper_data:/home/ubuntu/.cache/huggingface
    # No published port on purpose — evolution-api reaches it over the internal
    # Docker network only (http://evolution_whisper:8000), it never needs to be
    # exposed to the internet.

  evolution_postgres:
    image: postgres:15-alpine
    container_name: evolution_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evolution_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  evolution_redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: always
    volumes:
      - redis_data:/data

volumes:
  evolution_instances:
  postgres_data:
  redis_data:
